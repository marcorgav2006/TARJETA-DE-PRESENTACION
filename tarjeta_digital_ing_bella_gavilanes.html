  <script>
    // Función para alternar los acordeones
    function toggleAccordion(contentId, chevronId) {
      const content = document.getElementById(contentId);
      const chevron = document.getElementById(chevronId);
      
      const isOpen = content.classList.contains('open');
      if (isOpen) {
        content.classList.remove('open');
        chevron.classList.remove('rotate');
      } else {
        content.classList.add('open');
        chevron.classList.add('rotate');
      }
    }

    // Notificación emergente toast accesible
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      const toastText = document.getElementById('toastMessage');
      
      toastText.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 3000);
    }

    // Copiar datos al portapapeles
    function copyToClipboard(text, label) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(label + ' copiado al portapapeles');
      } catch (err) {
        showToast('No se pudo copiar automáticamente');
      }
    }

    // Compartir tarjeta (Web Share API nativa o copiar enlace)
    function shareCard() {
      if (navigator.share) {
        navigator.share({
          title: 'Ing. Bella Gavilanes - Tarjeta de Contacto',
          text: 'Contacto de Ing. Bella Gavilanes - Almacenes Estuardo Sánchez',
          url: window.location.href,
        }).catch(() => {});
      } else {
        copyToClipboard(window.location.href, 'Enlace de la tarjeta');
      }
    }

    // Generador y descarga del archivo vCard (.vcf) compatible con Android y iPhone (iOS)
    function downloadVCard() {
      const vcardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Gavilanes;Bella;;Ing.;',
        'FN:Ing. Bella Gavilanes',
        'ORG:Almacenes Estuardo Sánchez',
        'TITLE:Ingeniera',
        'TEL;TYPE=CELL,VOICE:+593995354655',
        'EMAIL;TYPE=INTERNET,WORK,PREF:bellagc@hotmail.com',
        'NOTE:Contacto profesional de Almacenes Estuardo Sánchez',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Ing_Bella_Gavilanes.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast('Descargando contacto para guardar...');
    }
  </script>
